spring.application.name=jobhub-backend
server.port=8080

# Create the database once in MySQL: CREATE DATABASE jobhub_db;
spring.datasource.url=jdbc:mysql://localhost:3306/jobhub_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
